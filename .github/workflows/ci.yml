# Build, vet and test on every push and PR; build the image on PRs and push it to GHCR from main
# and from v<semver> tags. Flux in the cluster picks the newest main-<sha7>-<run> tag and rolls it
# out. Tags and labels: dozlab-api docs/decision.md, "CI on GitHub Actions, CD with Flux".
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']   # path filters don't apply to tag pushes
    paths-ignore: ['**.md', 'docs/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/dozlab/dozlab-terminal

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Tags, all immutable except the semver major/minor ones:
      #   main-<sha7>-<run>  main; Flux's ImagePolicy orders by the run number
      #   sha-<full sha>     main and v* tags; finds the image for a commit
      #   1.2.3, 1.2, 1      v1.2.3 git tags (1 is skipped while the major is 0)
      #   pr-<n>             PRs; built, never pushed
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main-{{sha}}-${{ github.run_number }},enable={{is_default_branch}}
            type=sha,format=long,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=pr
          # No `latest`: Flux can't see a mutable tag change, and it hides what runs
          flavor: latest=false
          # org.opencontainers.image.{title,description,url,source,version,created,revision,licenses}
          labels: |
            org.opencontainers.image.title=dozlab-terminal
            org.opencontainers.image.vendor=DozLab
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
